<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auxo — Sign in</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f14;color:#eef3f8;font:15px system-ui}.card{width:min(92vw,420px);background:#121923;border:1px solid #263241;border-radius:18px;padding:28px}h1{font-size:30px;margin:0 0 6px}.muted{color:#8fa0b3;margin:0 0 24px}label{display:block;margin:14px 0 7px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #334255;background:#0d131b;color:white}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;font-weight:700}.error{min-height:22px;margin-top:14px;color:#ff8585}.setup{display:none}</style></head><body><main class="card"><h1>Auxo</h1><p class="muted" id="subtitle">Sign in to your trading dashboard.</p><form id="form"><div class="setup" id="nameWrap"><label>Display name</label><input id="name" value="Auxo Owner"></div><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required minlength="10" autocomplete="current-password"><button id="submit">Sign in</button><div class="error" id="error"></div></form></main><script>let setup=false;const $=id=>document.getElementById(id);async function init(){const r=await fetch('/api/auth/me',{credentials:'same-origin'}),d=await r.json();if(d.authenticated){location.replace('/');return}setup=!d.auth_configured;if(setup){$('subtitle').textContent='Create the owner login for this Auxo installation.';$('nameWrap').style.display='block';$('submit').textContent='Create owner account';$('password').autocomplete='new-password'}}$('form').addEventListener('submit',async e=>{e.preventDefault();$('error').textContent='';$('submit').disabled=true;try{const p={email:$('email').value,password:$('password').value};if(setup)p.display_name=$('name').value;const r=await fetch(setup?'/api/auth/setup':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(p)}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Authentication failed');location.replace('/')}catch(err){$('error').textContent=err.message}finally{$('submit').disabled=false}});init().catch(()=>{$('error').textContent='Could not contact Auxo.'});</script></body></html>
